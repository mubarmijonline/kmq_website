# Shared location blocks for kmq, included by every server block so the
# proxied and direct ports can never drift apart.
#
# nginx does not merge add_header across levels: a location that declares one
# of its own inherits none of the server block's. Both locations below declare
# a Cache-Control, so both must restate the three security headers from
# kmq_nginx.conf verbatim or silently lose them. Change them in one place and
# they must change in all three.

client_max_body_size 25m;

# Fingerprinted output only. kmq.<sha10>.css changes name whenever it changes
# content, so "immutable" is true: the browser never has to ask again.
location /static/build/ {
    alias /projects/kmq_website/static/build/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Serve a pre-compressed .gz sibling when one exists. Note this is why a
    # stale .gz silently wins over an edited source file — rebuild both together.
    gzip_static on;
}

# Everything else under /static/ keeps its name when its content changes —
# a replaced photograph is still ppf-matte-800.avif. "immutable" applied here
# was a real bug and it cost a day: the client replaced three service
# photographs, the new files were on the origin, and the CDN went on serving
# the year-old copies to everyone because immutable means "never revalidate".
#
# A week, and revalidated after it. Templates also hang ?v=<build> on these
# URLs, which is what actually forces the change through the moment it ships;
# this header is the safety net for anything that does not go through a
# template.
location /static/ {
    alias /projects/kmq_website/static/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    gzip_static on;
}

location / {
    # The document is never reused without revalidating. Everything under
    # /static/ is fingerprinted and served immutable for a year, which only
    # works if the page naming those fingerprints is always fresh. Without
    # this the response carries no freshness information at all, browsers
    # fall back to heuristic caching, and a visitor can be served an old page
    # pointing at an old bundle — both out of local cache, with no request
    # reaching us. That is how a shipped change keeps looking unshipped.
    # no-cache still stores the response; it only forces revalidation.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    proxy_pass http://kmq;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 180s;
    proxy_buffering on;
}
