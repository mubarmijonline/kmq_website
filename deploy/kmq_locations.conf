# Shared location blocks for kmq, included by every server block so the
# proxied and direct ports can never drift apart.

client_max_body_size 25m;

location /static/ {
    alias /projects/kmq_website/static/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Serve a pre-compressed .gz sibling when one exists. Note this is why a
    # stale .gz silently wins over an edited source file — rebuild both together.
    gzip_static on;
}

location / {
    proxy_pass http://kmq;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 180s;
    proxy_buffering on;
}
