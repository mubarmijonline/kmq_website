# kmq — kmq-ksa.com
#
# Install:
#   sudo ln -sf /projects/kmq_website/deploy/kmq_nginx.conf /etc/nginx/sites-enabled/kmq
#   sudo nginx -t && sudo systemctl reload nginx
#
# Two HTTPS entry points onto the same app:
#   :443              through the CDN proxy (the DNS record is proxied)
#   :4023   straight to this origin, bypassing the proxy. The proxy
#                     cannot forward a non-standard port, so this route only
#                     works against the origin address directly — and it needs
#                     4023 open in the cloud VPC firewall.
#
# Certificates:
#   kmq-ksa.com  Let's Encrypt, /etc/letsencrypt/live/kmq-ksa.com/, covering the
#   www.kmq-ksa.com  apex and www together, auto-renewed
#                by the certbot timer against /var/www/acme.
#   :4023        the Cloudflare origin cert, because that port answers on the
#                bare IP where no public name — and so no Let's Encrypt
#                certificate — applies.
#
# The site moved here from kmq.mubarmijonline.com on 2026-08-26. That name is
# gone: the DNS record was deleted and no block answers for it, which was the
# client's decision over a redirect.

upstream kmq {
    server 127.0.0.1:4024 fail_timeout=0;
    keepalive 16;
}

# --- HTTPS through the proxy --------------------------------------------------
server {
    # No http2 parameter here on purpose. Protocol options belong to the socket,
    # and whichever server block opens 0.0.0.0:443 first already set it; repeating
    # it only earns a "protocol options redefined" warning. Port 4023
    # below is ours alone, so it does declare http2.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kmq-ksa.com;

    ssl_certificate     /etc/letsencrypt/live/kmq-ksa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kmq-ksa.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:kmqTLS:2m;
    ssl_session_timeout 1h;

    # Restore the real client address from the proxy's header. Only safe here,
    # where every request genuinely arrives via the proxy.
    include /projects/kmq_website/deploy/kmq_realip.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    include /projects/kmq_website/deploy/kmq_locations.conf;
}

# --- www folds into the apex --------------------------------------------------
# One canonical address, so the two do not split rankings or cookies.
#
# Enabled 2026-08-26, once www.kmq-ksa.com had a DNS record and the
# certificate above was expanded to cover it. Both halves are required: this
# block under an apex-only certificate is a name-mismatch warning in every
# browser, which is worse than the NXDOMAIN it replaces.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kmq-ksa.com;

    ssl_certificate     /etc/letsencrypt/live/kmq-ksa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kmq-ksa.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://kmq-ksa.com$request_uri;
}

# --- HTTPS direct on 4023 -------------------------------------------
server {
    listen 4023 ssl http2;
    listen [::]:4023 ssl http2;
    # The bare IP and the catch-all stay: this port exists to reach the origin
    # when the proxy is not in the way, and it is addressed by IP, not by name.
    server_name kmq-ksa.com 34.63.221.109 _;

    # Not the Let's Encrypt cert. That one is issued for kmq-ksa.com, and this
    # port is reached at https://34.63.221.109:4023 — a certificate cannot
    # carry a name for an address, so any cert is a mismatch here. The
    # Cloudflare origin cert is the honest placeholder, and nothing public
    # depends on this port validating.
    ssl_certificate     /etc/nginx/certs/elamal.pem;
    ssl_certificate_key /etc/nginx/certs/elamal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:kmqTLS4023:2m;
    ssl_session_timeout 1h;

    # Deliberately no real_ip here: traffic on this port arrives straight from
    # the client, so $remote_addr is already correct. Trusting a forwarded-for
    # header on an unproxied port would let a caller spoof its own address and
    # walk past the login rate limit.

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    include /projects/kmq_website/deploy/kmq_locations.conf;
}

# --- plain HTTP redirects to HTTPS --------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name kmq-ksa.com www.kmq-ksa.com;

    # Let's Encrypt renews over HTTP-01, so the challenge path has to survive
    # the redirect below or every renewal fails ninety days from now.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / { return 301 https://kmq-ksa.com$request_uri; }
}
